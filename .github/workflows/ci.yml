name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # LorisSync uses OS 26 SDK APIs (sharing options, administrator role):
      # build with the newest stable Xcode on the runner, never a pinned old one.
      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      # Runs after third-party actions so they never see the key.
      # LorisFoundation is private. FOUNDATION_DEPLOY_KEY is the private half of
      # a read-only deploy key registered on that repository only.
      - name: Authorize private LorisFoundation dependency
        env:
          FOUNDATION_DEPLOY_KEY: ${{ secrets.FOUNDATION_DEPLOY_KEY }}
          GH_API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "$FOUNDATION_DEPLOY_KEY" ]; then
            echo "::error::Missing FOUNDATION_DEPLOY_KEY secret (read-only deploy key for lowrisk75/LorisFoundation)."
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$FOUNDATION_DEPLOY_KEY" > ~/.ssh/foundation_deploy
          chmod 600 ~/.ssh/foundation_deploy
          # GitHub host keys from its HTTPS API (no trust-on-first-use).
          # Authenticated (shared-runner IPs hit the anonymous rate limit), with retries.
          curl -fsSL --retry 5 --retry-all-errors -H "Authorization: Bearer $GH_API_TOKEN" \
            https://api.github.com/meta -o "$RUNNER_TEMP/github-meta.json"
          python3 -c 'import json,sys; keys=json.load(open(sys.argv[1]))["ssh_keys"]; assert keys; [print("github.com", k) for k in keys]' \
            "$RUNNER_TEMP/github-meta.json" > ~/.ssh/known_hosts
          # ssh config (not core.sshCommand): SwiftPM may set its own GIT_SSH_COMMAND.
          printf 'Host github.com\n  IdentityFile ~/.ssh/foundation_deploy\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config
          git config --global url."git@github.com:lowrisk75/LorisFoundation".insteadOf \
            "https://github.com/lowrisk75/LorisFoundation"

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build -v

      - name: Run tests
        run: swift test -v
