name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # LorisSync uses OS 26 SDK APIs (sharing options, administrator role):
      # build with the newest stable Xcode on the runner, never a pinned old one.
      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      # Runs after third-party actions so they never see the key.
      # LorisFoundation is private. FOUNDATION_DEPLOY_KEY is the private half of
      # a read-only deploy key registered on that repository only.
      - name: Authorize private LorisFoundation dependency
        env:
          FOUNDATION_DEPLOY_KEY: ${{ secrets.FOUNDATION_DEPLOY_KEY }}
        run: |
          if [ -z "$FOUNDATION_DEPLOY_KEY" ]; then
            echo "::error::Missing FOUNDATION_DEPLOY_KEY secret (read-only deploy key for lowrisk75/LorisFoundation)."
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$FOUNDATION_DEPLOY_KEY" > ~/.ssh/foundation_deploy
          chmod 600 ~/.ssh/foundation_deploy
          # GitHub host keys from its HTTPS API (no trust-on-first-use).
          curl -fsSL https://api.github.com/meta | python3 -c 'import json,sys; [print("github.com", k) for k in json.load(sys.stdin)["ssh_keys"]]' > ~/.ssh/known_hosts
          git config --global core.sshCommand "ssh -i ~/.ssh/foundation_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          git config --global url."git@github.com:lowrisk75/LorisFoundation".insteadOf \
            "https://github.com/lowrisk75/LorisFoundation"

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build -v

      - name: Run tests
        run: swift test -v
