name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # LorisSync uses OS 26 SDK APIs (sharing options, administrator role):
      # build with the newest stable Xcode on the runner, never a pinned old one.
      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build -v

      - name: Run tests
        run: swift test -v
